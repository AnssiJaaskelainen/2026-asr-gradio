services:
  api:
    build: .
    ports:
      - "10001:10001"
    env_file:
      - .env
    volumes:
      - ./caches:/app/caches
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-16g}
    # command removed: using Dockerfile CMD

  gradio:
    build: .
    ports:
      - "10002:10002"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    command: ["python3", "/app/app.py"]