services:
  api:
    build: .
    ports:
      - "10001:10001"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      # CHANGED: Use named volumes for models and caches (Internal Linux Speed/Permissions)
      - whisper_caches:/app/caches
      - whisper_models:/app/models
      # KEEP: Bind mount for transcripts (So you can see the .txt files in Windows)
      - ./transcripts:/transcripts
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-16g}

  gradio:
    build: .
    ports:
      - "10002:10002"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./transcripts:/transcripts
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["python3", "/app/app.py"]

# THIS SECTION IS REQUIRED FOR NAMED VOLUMES
volumes:
  whisper_models:
  whisper_caches: