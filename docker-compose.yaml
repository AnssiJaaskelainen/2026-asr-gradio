services:
  api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "10001:10001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - whisper_caches:/app/caches
      - whisper_models:/app/models
      - ./transcripts:/transcripts
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: ${API_MEMORY_LIMIT:-16g}
    command: ["python3", "/app/api.py"]

  api-cpu:
    build: .
    ports:
      - "10001:10001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - whisper_caches:/app/caches
      - whisper_models:/app/models
      - ./transcripts:/transcripts
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-8g}
    command: ["python3", "/app/api.py"]

  gradio-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "10002:10002"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - whisper_caches:/app/caches
      - whisper_models:/app/models
      - ./transcripts:/transcripts
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - api-gpu
    command: ["python3", "/app/app.py"]

  gradio-cpu:
    build: .
    ports:
      - "10002:10002"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - whisper_caches:/app/caches
      - whisper_models:/app/models
      - ./transcripts:/transcripts
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - api-cpu
    command: ["python3", "/app/app.py"]

volumes:
  whisper_models:
  whisper_caches: